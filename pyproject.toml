[project]
name = "kira-vscode-adapter"
version = "0.1.0"
description = "Lightweight VS Code debug adapter for kira"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  {name = "Qixuan112", email = "3573568193@qq.com"},
]
license = {text = "MIT"}
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
]

[tool.setuptools]
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/Qixuan112/kira-vscode-adapter"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta:__legacy__"
